<main class="flex min-h-screen items-center justify-center bg-base-200/40 px-4 py-8">
  <section class="w-full max-w-md overflow-hidden rounded-2xl border border-base-300/80 bg-base-100 shadow-2xl shadow-primary/5">
    <div class="p-6 sm:p-8">
      <div class="flex flex-col items-center text-center">
        <div class="flex size-16 items-center justify-center rounded-2xl bg-gradient-to-tr from-primary/20 via-primary/10 to-secondary/20 text-primary ring-1 ring-primary/30 shadow-lg shadow-primary/10">
          <svg class="size-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div class="mt-5 inline-flex items-center gap-1.5 rounded-full bg-primary/10 px-3 py-1 text-xs font-semibold text-primary">
          <span class="size-1.5 rounded-full bg-secondary animate-pulse"></span>
          RIDER PORTAL
        </div>
        <h1 class="mt-3 text-2xl font-bold tracking-tight sm:text-3xl">เปิดใบงานจัดส่ง</h1>
        <p class="mt-2 max-w-xs text-sm leading-6 text-base-content/60">
          กรอกเลขใบงานที่ร้านมอบให้ เพื่อดูเส้นทางและรายการจัดส่งของคุณ
        </p>
      </div>

      @if (errorMessage()) {
      <div class="alert alert-error mt-6 text-sm flex items-start gap-2.5" role="alert">
        <svg class="size-5 shrink-0 text-error-content" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
      }

      <form class="mt-7 space-y-4" (submit)="$event.preventDefault(); login()">
        <div class="form-control w-full">
          <label class="label" for="worksheet-code">
            <span class="label-text font-semibold flex items-center gap-2">
              <svg class="size-4 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
              </svg>
              เลขใบงาน (Worksheet Code)
            </span>
          </label>
          <input
            id="worksheet-code"
            class="input input-bordered min-h-12 w-full bg-base-100 uppercase tracking-wider font-mono font-bold focus:border-primary focus:ring-1 focus:ring-primary"
            type="text"
            inputmode="text"
            autocomplete="one-time-code"
            autocapitalize="characters"
            placeholder="เช่น WORK-7F3K9A"
            [value]="worksheetCode()"
            (input)="setWorksheetCode($event)"
            [disabled]="loading()"
            required
          />
          <label class="label">
            <span class="label-text-alt text-base-content/55">รับเลขใบงานจากผู้จัดการร้านเพื่อเริ่มส่ง</span>
          </label>
        </div>

        <button class="btn btn-primary min-h-12 w-full text-base gap-2 shadow-lg shadow-primary/20 hover:shadow-primary/40 transition-all" type="submit" [disabled]="loading()">
          @if (loading()) {
          <span class="loading loading-spinner loading-sm"></span>
          กำลังตรวจสอบเลขใบงาน...
          } @else {
          <span>เปิดใบงาน</span>
          <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
          }
        </button>
      </form>
    </div>
  </section>
</main>
