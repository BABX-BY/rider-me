<main class="flex min-h-screen items-center justify-center bg-base-200/60 px-4 py-8">
  <section class="w-full max-w-md overflow-hidden rounded-box border border-base-300 bg-base-100 shadow-sm">
    <div class="p-6 sm:p-8">
      <div class="flex flex-col items-center text-center">
        <div class="flex size-16 items-center justify-center rounded-box bg-primary/10 text-3xl" aria-hidden="true">
          🛵
        </div>
        <p class="mt-5 text-sm font-medium text-primary">RIDER PORTAL</p>
        <h1 class="mt-2 text-2xl font-bold tracking-tight sm:text-3xl">เปิดใบงานจัดส่ง</h1>
        <p class="mt-2 max-w-xs text-sm leading-6 text-base-content/60">
          กรอกเลขใบงานที่ร้านมอบให้ เพื่อดูเส้นทางและรายการจัดส่งของคุณ
        </p>
      </div>

      @if (errorMessage()) {
      <div class="alert alert-error mt-6 text-sm" role="alert">
        <span>{{ errorMessage() }}</span>
      </div>
      }

      <form class="mt-7 space-y-4" (submit)="$event.preventDefault(); login()">
        <div class="form-control w-full">
          <label class="label" for="worksheet-code">
            <span class="label-text font-semibold">เลขใบงาน</span>
          </label>
          <input
            id="worksheet-code"
            class="input input-bordered min-h-12 w-full bg-base-100 uppercase focus:border-primary"
            type="text"
            inputmode="text"
            autocomplete="one-time-code"
            autocapitalize="characters"
            placeholder="เช่น WORK-7F3K9A"
            [value]="worksheetCode()"
            (input)="setWorksheetCode($event)"
            [disabled]="loading()"
            required
          />
          <label class="label">
            <span class="label-text-alt text-base-content/55">เลขนี้ใช้เปิดใบงานที่ร้านมอบให้คุณ</span>
          </label>
        </div>

        <button class="btn btn-primary min-h-12 w-full text-base" type="submit" [disabled]="loading()">
          @if (loading()) {
          <span class="loading loading-spinner loading-sm"></span>
          กำลังตรวจสอบเลขใบงาน...
          } @else {
          เปิดใบงาน
          <span aria-hidden="true">→</span>
          }
        </button>
      </form>
    </div>
  </section>
</main>
