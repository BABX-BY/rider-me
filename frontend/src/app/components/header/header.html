<header class="navbar border-b border-base-300/80 bg-base-100/90 backdrop-blur-md sticky top-0 z-30 px-4 sm:px-6 shadow-sm">
  <div class="flex-1 items-center gap-3">
    <a routerLink="/" class="flex items-center gap-2.5 group">
      <div class="flex size-9 items-center justify-center rounded-xl bg-gradient-to-br from-primary to-secondary text-primary-content shadow-md shadow-primary/25">
        <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="text-lg font-black tracking-tight bg-gradient-to-r from-primary via-blue-600 to-secondary bg-clip-text text-transparent">
          RiderX
        </span>
        <span class="text-[10px] uppercase tracking-wider text-base-content/50 font-semibold -mt-1">
          Route & Logistics
        </span>
      </div>
    </a>
  </div>

  <div class="flex flex-row gap-3 items-center">
    <nav class="tabs tabs-box bg-base-200/80 border border-base-300/60 p-1 rounded-xl">
      <a routerLink="/customers" routerLinkActive="tab-active" [routerLinkActiveOptions]="{ exact: true }" class="tab gap-2 text-sm transition-colors">
        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <span class="hidden sm:inline">ลูกค้า</span>
      </a>

      <a routerLink="/orders" routerLinkActive="tab-active" class="tab gap-2 text-sm transition-colors">
        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
        </svg>
        <span class="hidden sm:inline">ออเดอร์</span>
      </a>

      <a routerLink="/delivery-routes" routerLinkActive="tab-active" class="tab gap-2 text-sm transition-colors">
        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
        </svg>
        <span class="hidden sm:inline">เส้นทางจัดส่ง</span>
      </a>

      <a routerLink="/riders" routerLinkActive="tab-active" class="tab gap-2 text-sm transition-colors">
        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span class="hidden sm:inline">Rider</span>
      </a>
    </nav>

    <a routerLink="/rider/login" routerLinkActive="btn-active" class="btn btn-outline btn-primary btn-sm gap-2 rounded-xl transition-all shadow-sm shadow-primary/10 hover:shadow-primary/30">
      <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
      </svg>
      <span>Rider Portal</span>
    </a>
  </div>
</header>
